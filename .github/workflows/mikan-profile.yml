name: Mikan profile

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - profile.json
      - .profile/**
      - .github/workflows/mikan-profile.yml

permissions:
  contents: write

concurrency:
  group: mikan-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Refresh public profile cards
        run: node .profile/refresh.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit changed cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- profile-assets README.md .profile/icons.json .profile/data.json .profile/avatar.txt .profile/asset-versions.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(profile): refresh public GitHub activity'
            git push
          fi
