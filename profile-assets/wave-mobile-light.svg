<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="420" height="28" viewBox="0 0 420 28" role="img" aria-label="divider"><title>divider</title><style>text{font-family:G,R,'Google Sans','Segoe UI',Roboto,sans-serif;font-variation-settings:'ROND' 100}
.up{animation:up .8s cubic-bezier(.05,.7,.1,1) both}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.34,1.56,.64,1) both}
.fade{animation:fade .9s ease both}
.orbit{transform-box:fill-box;transform-origin:center;animation:spin 24s linear infinite}
.citrus{transform-box:fill-box;transform-origin:50% 80%;animation:citrus 6s ease-in-out infinite}
.signal{stroke-dasharray:8 12;animation:signal 9s linear infinite}
@keyframes citrus{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}
@keyframes signal{to{stroke-dashoffset:-120}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
.spin-r{transform-box:fill-box;transform-origin:center;animation:spin 28s linear infinite reverse}
.bob{transform-box:fill-box;transform-origin:center;animation:bob 7s ease-in-out infinite}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.2,0,0,1) both}
.wght{animation:wght 1.6s cubic-bezier(.2,0,0,1) .2s both}
.wave{animation:wave 2.4s linear infinite}
.blink{animation:blink 1s step-end infinite}
@keyframes blink{50%{opacity:0}}
@keyframes up{from{opacity:1;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:1;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
@keyframes fade{from{opacity:.88}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-10px) rotate(12deg)}}
@keyframes grow{from{transform:scaleX(.7)}to{transform:scaleX(1)}}
@keyframes wght{from{font-variation-settings:'ROND' 100,'wght' 400}to{font-variation-settings:'ROND' 100,'wght' 760}}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(-48px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><clipPath id="w"><rect x="0" y="0" width="420" height="28"/></clipPath><g clip-path="url(#w)"><path class="wave" d="M-48 14q12 10 24 0t24 0q12 10 24 0t24 0q12 10 24 0t24 0q12 10 24 0t24 0q12 10 24 0t24 0q12 10 24 0t24 0q12 10 24 0t24 0q12 10 24 0t24 0q12 10 24 0t24 0q12 10 24 0t24 0q12 10 24 0t24 0" fill="none" stroke="#914600" stroke-width="5" stroke-linecap="round"/></g></svg>